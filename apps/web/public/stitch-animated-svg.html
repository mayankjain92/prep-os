<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<title>PrepOS - Orbital Animated SVG Loader</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
</style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_148 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_148" style="display:block;">
<svg class="prepos-loader-orbital" height="100%" viewbox="0 0 300 300" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="50%" cy="50%" id="halo-glow" r="50%">
<stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"></stop>
<stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12"></stop>
<stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"></stop>
</radialgradient>
<lineargradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#818cf8"></stop>
<stop offset="50%" stop-color="#6366f1"></stop>
<stop offset="100%" stop-color="#38bdf8"></stop>
</lineargradient>
<lineargradient id="ring-grad-1" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"></stop>
<stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"></stop>
</lineargradient>
<filter height="160%" id="bloom" width="160%" x="-30%" y="-30%">
<fegaussianblur result="blur" stddeviation="3.5"></fegaussianblur>
<femerge>
<femergenode in="blur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
</defs>
<style>
    @keyframes pulse-core {
      0%, 100% { transform: scale(0.92); opacity: 0.85; filter: drop-shadow(0 0 8px rgba(99,102,241,0.5)); }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 16px rgba(56,189,248,0.85)); }
    }
    @keyframes spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes dash-orbit {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 360; }
    }
    @keyframes breath-ring {
      0%, 100% { opacity: 0.3; transform: scale(0.96); }
      50% { opacity: 0.8; transform: scale(1.03); }
    }
    .core-diamond {
      transform-origin: 150px 150px;
      animation: pulse-core 2.6s ease-in-out infinite;
    }
    .orbit-outer {
      transform-origin: 150px 150px;
      animation: spin-cw 9s linear infinite;
    }
    .orbit-mid {
      transform-origin: 150px 150px;
      animation: spin-ccw 6s linear infinite;
    }
    .orbit-dash {
      animation: dash-orbit 4s linear infinite;
    }
    .ambient-halo {
      transform-origin: 150px 150px;
      animation: breath-ring 3.4s ease-in-out infinite;
    }
  </style>
<!-- Ambient Glow -->
<circle class="ambient-halo" cx="150" cy="150" fill="url(#halo-glow)" r="110"></circle>
<!-- Static Track Rings -->
<circle cx="150" cy="150" fill="none" r="88" stroke="#262626" stroke-opacity="0.6" stroke-width="1.2"></circle>
<circle cx="150" cy="150" fill="none" r="62" stroke="#262626" stroke-opacity="0.5" stroke-width="1.2"></circle>
<!-- Outer Orbit Segment -->
<g class="orbit-outer">
<circle cx="150" cy="150" fill="none" filter="url(#bloom)" r="88" stroke="url(#ring-grad-1)" stroke-dasharray="70 210" stroke-linecap="round" stroke-width="2.5"></circle>
<circle cx="238" cy="150" fill="#38bdf8" filter="url(#bloom)" r="4"></circle>
<circle cx="62" cy="150" fill="#818cf8" r="2.5"></circle>
</g>
<!-- Mid Counter-Rotating Orbit -->
<g class="orbit-mid">
<circle cx="150" cy="150" fill="none" filter="url(#bloom)" r="62" stroke="#6366f1" stroke-dasharray="45 150" stroke-linecap="round" stroke-width="2"></circle>
<circle cx="150" cy="88" fill="#6366f1" filter="url(#bloom)" r="3.5"></circle>
<circle cx="150" cy="212" fill="#38bdf8" r="2"></circle>
</g>
<!-- Central Diamond AI / Telemetry Spark -->
<g class="core-diamond">
<!-- Outer Glow Rhombus -->
<path d="M 150 116 C 150 134 166 150 184 150 C 166 150 150 166 150 184 C 150 166 134 150 116 150 C 134 150 150 134 150 116 Z" fill="url(#primary-grad)" filter="url(#bloom)"></path>
<!-- Precision Inner Highlight -->
<circle cx="150" cy="150" fill="#ffffff" filter="url(#bloom)" r="3.5"></circle>
</g>
</svg>
</div>
<!-- STITCH_SVG_END:ANIMATION_148 -->
</body>
</html>
