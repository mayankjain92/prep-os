name: Render Backend Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set in repository secrets."
            echo "Pinging default fallback if configured or exit."
            # Edit this URL to your deployed Render URL or set RENDER_BACKEND_URL in GitHub Secrets
            URL="https://your-app.onrender.com/health"
          fi
          echo "Sending HTTP request to $URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Response HTTP Status: $HTTP_STATUS"
